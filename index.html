<!DOCTYPE html>
<html>
<head>
    <title>Student Task Manager</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>

<body>

    <h1>Student Task Manager</h1>
<div class="search-container">
  <input type="text" id="taskSearch" placeholder="Search tasks..." onkeyup="searchTasks()">
</div>  
    <form>
        <label>Task Title:</label>
        <input type="text" placeholder="Enter task title">

        <br><br>

        <label>Description:</label>
        <textarea placeholder="Enter task description"></textarea>

        <br><br>

        <button type="button">Add</button>
    </form>
    <h2>My Tasks</h2>

<div class="task-item">
    <h3>Complete OOP Assignment</h3>
    <p>Finish the class and object questions.</p>
</div>

<div class="task-item">
    <h3>Study Data Structures</h3>
    <p>Revise arrays and linked lists.</p>
</div>

<div class="task-item">
    <h3>Prepare Presentation</h3>
    <p>Complete the research presentation slides.</p>
</div>

<script src="script.js"></script>

</body>
</html>
